<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud File Storage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>☁ Cloud File Storage</h1>
        <p>Store and manage your files easily</p>
    </header>

    <div class="container">

        <div class="upload-box">
            <h2>Upload File</h2>

            <input type="file" id="fileInput">

            <button onclick="uploadFile()">Upload to Cloud</button>

            <p id="message"></p>
        </div>

        <div class="files-section">
            <h2>My Files</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search files..."
                onkeyup="searchFiles()"
            >

            <table>
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Size</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="fileList">
                </tbody>
            </table>
        </div>

    </div>

    <footer>
        <p>© 2026 Cloud File Storage | Cloud Computing Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
